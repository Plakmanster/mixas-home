<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#681822"><title>Νυφικό Κρεβάτι | Μίχας HOME</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#38302c;font-family:Manrope,Arial,sans-serif}header{text-align:center;background:#f4ede4;padding:24px;border-bottom:3px solid #681822}header img{width:min(280px,80%)}main{max-width:1200px;margin:auto;padding:24px 24px 60px}a{color:#681822;text-decoration:none}.back{font-size:14px;display:inline-block;padding:10px 0}h1{font:400 clamp(32px,5vw,48px) Georgia,serif;color:#681822;margin:18px 0 12px}.intro{text-align:center;margin:20px 0 36px}.intro p{line-height:1.7;color:#766d67}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.tile{border:1px solid #e6d9cd;border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;padding:0;box-shadow:0 3px 16px #47352814}.tile img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}.tile span{display:block;background:#f5eee9;color:#681822;padding:10px;font-size:13px}footer{text-align:center;padding:30px 15px;color:#681822;border-top:1px solid #e6d9cd;font-size:13px}dialog{border:0;background:#211b19;color:white;padding:16px;width:min(95vw,1100px);max-height:95dvh;border-radius:8px}dialog::backdrop{background:#000c}dialog img{display:block;max-width:100%;width:auto;max-height:72dvh;margin:auto;object-fit:contain}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}dialog button{background:#681822;color:white;border:1px solid #ffffff55;border-radius:5px;padding:10px 15px;cursor:pointer;font-size:18px}button:focus-visible,a:focus-visible{outline:3px solid #b68d60;outline-offset:3px}@media(max-width:650px){main{padding:16px 14px 40px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile span{font-size:12px}header{padding:16px}.intro{margin:12px 0 25px}}.gallery{gap:28px;align-items:center}.tile{border:0;border-radius:3px;background:transparent;box-shadow:none;transition:transform .2s}.tile:hover{transform:scale(1.025)}.tile img{aspect-ratio:auto;height:auto;max-height:440px;object-fit:contain}header{background:linear-gradient(90deg,#f5eee5,#fffaf2 48%,#f5eee5);border-bottom:1px solid #e6d9cd;padding:30px}.intro{margin:25px 0 42px}@media(max-width:650px){.gallery{gap:16px}.intro{margin:15px 0 25px}}</style></head><body><header><a href="/"><img src="/assets/mixas-logo.svg" alt="Μίχας HOME"></a></header><main><a class="back" href="/#categories">← Επιστροφή στις κατηγορίες</a><section class="intro"><h1>Νυφικό Κρεβάτι</h1><p>Ρομαντισμός και κομψότητα για ένα ξεχωριστό ξεκίνημα.</p></section><div class="gallery"><button class="tile" type="button" data-index="0" aria-label="Μεγέθυνση φωτογραφίας 1"><img src="/assets/nyfiko/1.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 1" loading="lazy"></button><button class="tile" type="button" data-index="1" aria-label="Μεγέθυνση φωτογραφίας 2"><img src="/assets/nyfiko/2.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 2" loading="lazy"></button><button class="tile" type="button" data-index="2" aria-label="Μεγέθυνση φωτογραφίας 3"><img src="/assets/nyfiko/3.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 3" loading="lazy"></button><button class="tile" type="button" data-index="3" aria-label="Μεγέθυνση φωτογραφίας 4"><img src="/assets/nyfiko/4.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 4" loading="lazy"></button><button class="tile" type="button" data-index="4" aria-label="Μεγέθυνση φωτογραφίας 5"><img src="/assets/nyfiko/5.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 5" loading="lazy"></button><button class="tile" type="button" data-index="5" aria-label="Μεγέθυνση φωτογραφίας 6"><img src="/assets/nyfiko/6.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 6" loading="lazy"></button><button class="tile" type="button" data-index="6" aria-label="Μεγέθυνση φωτογραφίας 7"><img src="/assets/nyfiko/7.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 7" loading="lazy"></button><button class="tile" type="button" data-index="7" aria-label="Μεγέθυνση φωτογραφίας 8"><img src="/assets/nyfiko/8.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 8" loading="lazy"></button><button class="tile" type="button" data-index="8" aria-label="Μεγέθυνση φωτογραφίας 9"><img src="/assets/nyfiko/9.jpg" alt="Νυφικό κρεβάτι — φωτογραφία 9" loading="lazy"></button></div></main><footer>© 2026 Μίχας HOME · Με επιφύλαξη παντός δικαιώματος</footer><dialog aria-label="Προβολή φωτογραφιών"><div class="controls"><span id="count"></span><button id="close" aria-label="Κλείσιμο">×</button></div><img id="large" alt=""><div class="controls"><button id="prev" aria-label="Προηγούμενη φωτογραφία">←</button><button id="next" aria-label="Επόμενη φωτογραφία">→</button></div></dialog><script>const d=document.querySelector('dialog'),tiles=[...document.querySelectorAll('.tile')],large=document.getElementById('large');let current=0;function show(i){current=(i+tiles.length)%tiles.length;const img=tiles[current].querySelector('img');large.src=img.src;large.alt=img.alt;document.getElementById('count').textContent=(current+1)+' / '+tiles.length}tiles.forEach((t,i)=>t.addEventListener('click',()=>{show(i);d.showModal()}));document.getElementById('close').onclick=()=>d.close();document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);d.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});d.addEventListener('click',e=>{if(e.target===d)d.close()});</script></body></html>
